- q: "With the Euclidean distance as the similarity measure, the best template match is at the position with"
  options:
    - "the highest score"
    - "the lowest score"
    - "a score of exactly 1"
    - "the most edges"
  answer: 1
  explain: "The distance is smallest where template and image agree; for correlation the best match is the highest score."
- q: "Why does plain cross-correlation produce false maxima?"
  options:
    - "Because it reverses the template"
    - "Because the score also rises wherever the image is bright, regardless of the pattern"
    - "Because it uses edges"
    - "Because the template is too small"
  answer: 1
  explain: "Normalised cross-correlation subtracts the local mean and divides by the standard deviation to remove this effect."
- q: "Compared with plain correlation, normalised cross-correlation is"
  options:
    - "cheaper, since it needs no multiplication"
    - "more expensive, since the mean and standard deviation of the image region must be recomputed at every position"
    - "identical in cost"
    - "only defined for binary images"
  answer: 1
  explain: "The template statistics are constant but the image statistics change with position."
- q: "Why is the shortest distance a poor measure of how well two shapes match?"
  options:
    - "It is expensive to compute"
    - "It can be the same for shapes that nearly coincide and shapes that barely touch"
    - "It is always zero"
    - "It needs colour information"
  answer: 1
  explain: "A single nearest pair of points says nothing about the rest of the shapes."
- q: "In chamfer matching, the chamfer image is"
  options:
    - "the Canny edge map"
    - "the distance transform of the inverted edge image, giving each pixel its distance to the nearest edge"
    - "the template"
    - "the correlation map"
  answer: 1
  explain: "Summing chamfer-image values under the template at each position gives the chamfer distance."
- q: "The directed Hausdorff distance h(A, B) is"
  options:
    - "the minimum over a of the minimum over b of the distance"
    - "the maximum over a of the minimum distance from a to any point of B"
    - "the average distance between A and B"
    - "always equal to h(B, A)"
  answer: 1
  explain: "It is a max-min; the full Hausdorff distance is the larger of the two directed distances, which are not symmetric."
