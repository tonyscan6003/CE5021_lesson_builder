- q: "After fftshift, where in the 2D spectrum of a photograph is the brightest point normally found?"
  options:
    - "The top-left corner"
    - "The centre, because images contain a lot of low-frequency energy"
    - "The edges"
    - "It is randomly placed"
  answer: 1
  explain: "fftshift moves the zero-frequency (DC) term to the centre, and smooth image regions put most energy there."
- q: "A basis function with k = 0 and l = 3 looks like"
  options:
    - "vertical stripes"
    - "horizontal stripes varying along y only"
    - "a uniform grey image"
    - "diagonal stripes"
  answer: 1
  explain: "k controls variation along x and l along y; with k = 0 the intensity varies only along y."
- q: "Reconstructing an image from its Fourier phase with all magnitudes set to one gives"
  options:
    - "a blank image"
    - "an image in which the edges and structure of the scene are still visible"
    - "the original image exactly"
    - "a symmetric blob"
  answer: 1
  explain: "Phase carries the structural information; the magnitude-only reconstruction is the one that loses the scene."
- q: "Why does an ideal (disc-shaped) low-pass filter cause ringing in the filtered image?"
  options:
    - "Because the disc removes the DC term"
    - "Because the inverse transform of a disc is a Bessel function, which oscillates"
    - "Because the image is not square"
    - "Because fftshift was not applied"
  answer: 1
  explain: "A sharp-edged disc in one domain corresponds to an oscillating (ringing) function in the other."
- q: "Which mask blurs an image in the frequency domain without introducing ringing?"
  options:
    - "A disc"
    - "A square"
    - "A Gaussian"
    - "A single line"
  answer: 2
  explain: "The Fourier transform of a Gaussian is a Gaussian, so the equivalent spatial kernel has no oscillations."
- q: "A photograph contains regular diagonal stripes from electrical interference. The best frequency-domain remedy is"
  options:
    - "a wide Gaussian low-pass filter"
    - "a notch filter that zeros the pair of peaks corresponding to the stripe frequency"
    - "a high-pass filter"
    - "windowing with a Hann window"
  answer: 1
  explain: "Periodic noise concentrates at one frequency pair; removing only those coefficients leaves the rest of the image untouched."
