- q: In a deep CNN such as AlexNet, which layer type dominates the computational requirements?
...
  options:
    - Convolution layers
...
    - Pooling layers
...
    - Fully connected layers
...
  answer: 0
  explain: Convolution layers apply many kernels across every channel at every spatial position, so they dominate the multiply-accumulate count. Pooling just sweeps each feature map independently and has no parameters at all.
...
- q: In a deep CNN such as VGG-19, which layer type dominates the memory requirements?
...
  options:
    - Pooling layers
...
    - Convolution layers
...
    - Fully connected layers
...
  answer: 2
  explain: Fully connected layers hold one weight per input-output pair and dominate the parameter count. Convolution layers share the same kernel across every spatial position, so they need far fewer parameters. Pooling layers have none.
...
- q: Why does the VGG family of networks have such a large number of parameters?
...
  options:
    - It has no pooling layers
...
    - It uses very large fully connected layers at the output
...
    - It uses small 1×1 convolutions
...
  answer: 1
  explain: The large fully connected layers at the output carry most of VGG's parameters. 1×1 convolutions are an efficient way to reduce parameter counts, and VGG does use pooling — which contributes no parameters in any case.
...
- q: Why is a stack of 3×3 convolutions computationally efficient?
...
  options:
    - It removes the need for activation functions between layers
...
    - It gives a receptive field equivalent to a much larger kernel while using fewer parameters
...
    - It increases the spatial resolution of the feature maps
...
  answer: 1
  explain: Two stacked 3×3 convolutions see the same 5×5 region as one 5×5 convolution but use 18 weights per channel pair instead of 25, and three stacked see 7×7 for 27 instead of 49. Activation functions are still needed between the layers — they are what makes the stack more expressive than a single large kernel.
...
- q: What is the reasoning behind the network-in-network concept?
...
  options:
    - It removes the need for convolution layers entirely
...
    - It reduces the spatial size of the feature maps
...
    - Convolution alone is linear, so a small fully connected network inside the convolution raises local representational power and reduces the need for large fully connected layers at the output
...
  answer: 2
  explain: Convolution is a linear operation, so its representational power is limited. Embedding a small fully connected network raises the capacity locally. Convolution layers are still used, and the more discriminative features that result mean a global average pooling stage and a single fully connected layer can replace the large output layers.
...
- q: What is the function of a global average pooling layer?
...
  options:
    - It pools a feature map of any spatial size down to a fixed-length vector, replacing the fully connected layers
...
    - It replaces the convolution layers
...
    - It increases the number of channels in the feature map
...
  answer: 0
  explain: Global average pooling reduces any spatial size to one value per channel, so it both fixes the output length and removes the need for large fully connected layers. The convolutional part of the network must carry more capacity to compensate for the parameters given up.
...
- q: Why did the authors of Inception need to find a dense equivalent to a sparse network?
...
  options:
    - Sparse networks are faster
...
    - Modern GPUs are designed for dense computation and cannot exploit sparse matrices
...
    - Dense networks have fewer parameters
...
  answer: 1
  explain: Sparse connectivity is attractive in theory, but GPU hardware is built for dense matrix multiplication and gains nothing from sparsity. Inception approximates the sparse structure with dense building blocks.
...
- q: What is the purpose of a bottleneck (1×1) convolution?
...
  options:
    - To increase the number of parameters
...
    - To eliminate the need for pooling layers
...
    - To reduce the amount of computation in a convolution operation
...
    - To reduce the spatial dimensionality of the feature maps
...
  answer: 2
  explain: A 1×1 convolution leaves the spatial size unchanged and reduces the channel count, so the larger kernel that follows operates on far fewer channels. Both the parameter count and the multiplication count fall. Because the spatial size is untouched, pooling is still needed.
