- q: "What distinguishes object detection from image classification?"
  options:
    - "Detection uses colour images"
    - "Detection also localises each object with a bounding box"
    - "Detection needs no training data"
    - "Detection is faster"
  answer: 1
  explain: "Localisation is the extra step, which also makes detection slower and enables tracking."
- q: "A classifier reports TP = 40, FP = 10, FN = 20, TN = 130. Its precision and recall are"
  options:
    - "0.80 and 0.67"
    - "0.67 and 0.80"
    - "0.85 and 0.85"
    - "0.40 and 0.20"
  answer: 0
  explain: "precision = 40/(40+10) = 0.80; recall = 40/(40+20) = 0.67."
- q: "Why is a Gaussian image pyramid used with a sliding-window detector?"
  options:
    - "To reduce noise"
    - "Because the window has a fixed size, so shrinking the image lets it cover larger objects"
    - "To increase precision"
    - "To colour-correct the image"
  answer: 1
  explain: "Large objects are found in the small pyramid levels, small objects in the large ones."
- q: "A predicted box and a ground-truth box each have area 100 and overlap by 40. The IoU is"
  options:
    - "0.40"
    - "0.25"
    - "0.60"
    - "0.80"
  answer: 1
  explain: "union = 100 + 100 − 40 = 160, so IoU = 40/160 = 0.25."
- q: "Why is accuracy not used to evaluate object detectors?"
  options:
    - "Because detectors are always perfect"
    - "Because true negatives would include the whole background and swamp the count"
    - "Because precision cannot be computed"
    - "Because boxes have no labels"
  answer: 1
  explain: "Only precision and recall are used; true negatives are not counted."
- q: "Which of these is NOT one of the recognition challenges discussed?"
  options:
    - "Occlusion"
    - "Intra-class variation"
    - "Image compression format"
    - "Illumination"
  answer: 2
  explain: "The challenges are viewpoint, illumination, scale, occlusion, clutter, deformation and intra-class variation."
