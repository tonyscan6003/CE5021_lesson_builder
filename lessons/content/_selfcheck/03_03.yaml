- q: "An 8 × 8 patch is split into four 4 × 4 cells, each with an 8-bin orientation histogram. The descriptor length is"
  options:
    - "8"
    - "16"
    - "32"
    - "64"
  answer: 2
  explain: "Four histograms of eight bins concatenated give 32 elements."
- q: "In a gradient histogram, a pixel with angle 35° and magnitude 12 contributes"
  options:
    - "1 to the first bin"
    - "12 to the bin containing 35°"
    - "35 to every bin"
    - "nothing"
  answer: 1
  explain: "Each pixel adds its gradient magnitude to the bin of its gradient direction."
- q: "Why is a characteristic orientation computed for each keypoint?"
  options:
    - "To rotate the whole image upright"
    - "So that gradient directions can be expressed relative to it, making the descriptor rotation invariant"
    - "To decide the number of bins"
    - "To find the keypoint's scale"
  answer: 1
  explain: "Two rotated copies of the same patch give the same descriptor once their directions are normalised to their own peak orientation."
- q: "Brute-force matching of descriptors is equivalent to"
  options:
    - "k-means with k = 2"
    - "k-nearest neighbours with k = 1, each reference descriptor being its own class"
    - "the Hough transform"
    - "thresholding"
  answer: 1
  explain: "Every test descriptor is assigned to the nearest reference descriptor in Euclidean distance."
- q: "In Lowe's ratio test a match is accepted when"
  options:
    - "the nearest neighbour is closer than about 0.7 times the distance to the second nearest"
    - "the two nearest neighbours are at the same distance"
    - "the distance is below 0.7"
    - "the second nearest neighbour is in the same image"
  answer: 0
  explain: "A distinctive match has a clear nearest neighbour; two neighbours at similar distances indicate ambiguity."
