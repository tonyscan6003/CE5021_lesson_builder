- q: "The defining feature of supervised learning is"
  options:
    - "the use of images"
    - "a labelled training set"
    - "a validation set"
    - "a linear classifier"
  answer: 1
  explain: "Supervised learning is learning from labelled examples."
- q: "Why must the test set never be used during training?"
  options:
    - "It is too small"
    - "Using it would over-estimate the classifier's performance on unseen data"
    - "It has no labels"
    - "It slows training down"
  answer: 1
  explain: "The test set exists to measure generalisation to data the classifier has not seen."
- q: "During training the training error keeps falling while the validation error starts to rise. This indicates"
  options:
    - "underfitting"
    - "overfitting"
    - "a good fit"
    - "a faulty dataset"
  answer: 1
  explain: "The classifier is fitting the training data ever more closely and losing its ability to predict new data."
- q: "A simple linear classifier applied to data with a curved boundary will show"
  options:
    - "high bias and low variance"
    - "low bias and high variance"
    - "low bias and low variance"
    - "high bias and high variance"
  answer: 0
  explain: "Its model cannot fit the data (bias) but its result changes little with different training data (low variance)."
- q: "Which is a remedy for overfitting?"
  options:
    - "Increasing classifier complexity"
    - "Reducing the dataset size"
    - "Applying regularisation or adding more training data"
    - "Removing the validation set"
  answer: 2
  explain: "Overfitting is reduced by more data, less complexity or a regularisation penalty."
- q: "What is the purpose of k-fold cross-validation?"
  options:
    - "To train k different classifiers for deployment"
    - "To obtain a reliable estimate of validation accuracy from limited data by averaging over k partitions"
    - "To choose the test set"
    - "To speed up training"
  answer: 1
  explain: "A single split may under- or over-estimate performance; averaging over k splits is more reliable."
