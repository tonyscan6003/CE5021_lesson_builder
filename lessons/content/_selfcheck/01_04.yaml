- q: "What window size is recommended for a sampled Gaussian kernel with σ = 2?"
  options:
    - "5 samples"
    - "9 samples"
    - "13 samples"
    - "25 samples"
  answer: 2
  explain: "M = 6σ + 1 = 13, covering ±6 samples about the centre."
- q: "A 15 × 15 separable kernel is applied as two 1D passes. How many multiplications per output pixel does this need, compared with direct 2D convolution?"
  options:
    - "15 versus 225"
    - "30 versus 225"
    - "225 versus 30"
    - "30 versus 30"
  answer: 1
  explain: "Two passes of 15 multiplications each (2k = 30) replace k² = 225 for the direct convolution."
- q: "Which statement expresses the superposition principle for a linear filter H?"
  options:
    - "(I₁ + I₂) ∗ H = I₁ ∗ H + I₂ ∗ H"
    - "I ∗ H = H ∗ I"
    - "I ∗ (H₁ ∗ H₂) = (I ∗ H₁) ∗ H₂"
    - "Shifting I shifts I ∗ H"
  answer: 0
  explain: "Superposition is the statement that the response to a sum equals the sum of the responses. The others are commutativity, associativity and shift invariance."
- q: "Salt-and-pepper noise is best removed by"
  options:
    - "a Gaussian blur, because it averages the impulses away"
    - "a median filter, because impulses are outliers that never reach the middle of the sorted window"
    - "a sharpening kernel"
    - "increasing the sensor gain"
  answer: 1
  explain: "The median ignores extreme values entirely, whereas a Gaussian blur only spreads them out."
- q: "What makes the bilateral filter non-linear even though it is built from two Gaussians?"
  options:
    - "It uses a larger kernel than the Gaussian filter"
    - "Its weights depend on the intensity differences, so the effective kernel changes from pixel to pixel"
    - "It sorts the pixel values"
    - "It is applied twice"
  answer: 1
  explain: "The range Gaussian is evaluated on the image values themselves, so the output is not a fixed linear combination of the inputs."
- q: "Two kernels H₁ and H₂ are applied in sequence to an image. Which property guarantees the same result if they are applied in the opposite order?"
  options:
    - "Superposition"
    - "Shift invariance"
    - "Commutativity of convolution"
    - "Normalisation of the kernels"
  answer: 2
  explain: "Convolution is commutative, so I ∗ H₁ ∗ H₂ = I ∗ H₂ ∗ H₁."
