- q: "A camera sensor with a Bayer filter records, at each pixel, how many colour values?"
  options:
    - "Three: red, green and blue"
    - "One: the colour of the filter over that pixel"
    - "Two: luminance and one colour"
    - "Four: red, two greens and blue"
  answer: 1
  explain: "Each pixel sits behind a single colour filter and records one value. The missing two colours are interpolated from neighbours during demosaicing."
- q: "Why does the Bayer pattern contain twice as many green filters as red or blue?"
  options:
    - "Green filters are cheaper to manufacture"
    - "Green light carries most of the luminance information for the human eye"
    - "Green pixels are less sensitive so more are needed"
    - "It makes demosaicing unnecessary for green"
  answer: 1
  explain: "The choice mimics the eye, which draws most of its brightness (luminance) information from green wavelengths."
- q: "How many distinct colours can an 8-bit-per-channel RGB image represent?"
  options:
    - "256"
    - "768"
    - "65,536"
    - "16,777,216"
  answer: 3
  explain: "256 levels per channel and three channels gives 256³ = 16,777,216."
- q: "An image has 4000 × 3000 recorded pixels. Which statement about its resolution is correct?"
  options:
    - "Its resolution is exactly 4000 × 3000 line pairs"
    - "The pixel count is an upper bound; the true resolution also depends on the lens"
    - "Resolution is independent of the pixel count"
    - "Resolution is determined by the bit depth"
  answer: 1
  explain: "The pixel count limits the finest detail that could be recorded; whether that detail is actually resolved depends on the optical quality of the lens."
- q: "Which of these is NOT a camera effect that can reduce the performance of a vision algorithm?"
  options:
    - "Rolling-shutter distortion of moving objects"
    - "Sensor noise at high gain"
    - "JPEG compression artefacts"
    - "Storing the image as a PNG file"
  answer: 3
  explain: "PNG is lossless. Rolling shutters, sensor gain noise and JPEG blocking all degrade the image before the algorithm sees it."
