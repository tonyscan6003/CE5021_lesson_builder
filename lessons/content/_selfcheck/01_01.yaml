# 1.1 2D convolution
# No Grasple MCQ source: Grasple_1d_convolution and Grasple_2d_convolution
# contain only numeric-entry exercises, which the conv2d / conv_arith
# generators already cover as worked examples. Authored from
# lesson_1_1_script and lesson_1_1_convolution.
- q: "The first step in performing a 2D convolution by hand is to"
  options:
    - "pad the image with a ring of zeros"
    - "flip the kernel horizontally and then vertically"
    - "normalise the kernel so its values sum to 1"
    - "transpose the image"
  answer: 1
  explain: "Convolution is defined with a reversed kernel, so the flip comes first. Padding is the second step and only has an effect when the kernel is moved to positions that fall outside the image."
- q: "A 7×7 input is convolved with a 3×3 kernel using 'same' padding and stride 1. What is the output size?"
  options:
    - "5×5"
    - "9×9"
    - "7×7"
    - "3×3"
  answer: 2
  explain: "'Same' padding is defined by the output matching the input, and for an odd kernel at unit stride it is achieved with p = ⌊k/2⌋ = 1 ring. Checking with the general formula: ⌊(7 + 2·1 − 3)/1⌋ + 1 = 7."
- q: "A 6×6 input is convolved with a 2×2 kernel with no padding and a stride of 2. What is the output size?"
  options:
    - "5×5"
    - "2×2"
    - "4×4"
    - "3×3"
  answer: 3
  explain: "With p = 0 the relationship is o = ⌊(i − k)/s⌋ + 1 = ⌊(6 − 2)/2⌋ + 1 = 3."
- q: "Why do convolutional networks sometimes use a stride greater than 1?"
  options:
    - "To downsample the feature map and reduce computation"
    - "To increase the number of parameters in the layer"
    - "To keep the output the same size as the input"
    - "To make the operation non-linear"
  answer: 0
  explain: "A larger stride means fewer kernel positions, so the output is smaller and less computation is done. The parameter count depends only on the kernel size and channel counts, not on the stride, and convolution stays linear whatever the stride."
- q: "How many learnable parameters does a max pooling layer have?"
  options:
    - "One per input channel"
    - "One per window position"
    - "None"
    - "The same number as a convolution layer with the same window size"
  answer: 2
  explain: "Pooling applies a fixed aggregation — a maximum or a mean — to each window. There is no kernel, so there is nothing to learn. This is also the one operation here that is non-linear."
- q: "Cross-correlation and convolution give identical results when"
  options:
    - "the kernel is symmetric"
    - "the image is square"
    - "'same' padding is used"
    - "the stride is 1"
  answer: 0
  explain: "The only difference between the two operations is the kernel flip. A symmetric kernel is unchanged by the flip, so both give the same result. This is why deep learning frameworks can compute correlation while calling it convolution — the kernel weights are learned anyway."
