- q: "Why is the image NOT smoothed before computing HOG gradients?"
  options:
    - "Smoothing is too slow"
    - "Fine gradients carry information that is important for discrimination"
    - "The SVM requires raw pixels"
    - "Smoothing changes the window size"
  answer: 1
  explain: "Simple centre differences on the unsmoothed image preserve the fine edge structure."
- q: "A pixel has gradient angle 77° and magnitude 30. With bin centres at 70° and 90°, its contribution to the 70° bin is"
  options:
    - "30"
    - "19.5"
    - "10.5"
    - "0"
  answer: 1
  explain: "μ₁ = 30 × |90 − 77| / 20 = 19.5; the remaining 10.5 goes to the 90° bin."
- q: "A HOG block contains"
  options:
    - "one 8 × 8 cell"
    - "2 × 2 cells, giving a 36-element normalised histogram vector"
    - "the whole 128 × 64 window"
    - "9 pixels"
  answer: 1
  explain: "Four cells of nine bins each are concatenated and normalised together."
- q: "With 9 bins, 2 × 2 cells per block and 7 × 15 blocks, the descriptor length is"
  options:
    - "105"
    - "945"
    - "3780"
    - "8192"
  answer: 2
  explain: "36 values per block × 105 blocks = 3780."
- q: "Overlapping blocks help because"
  options:
    - "they halve the computation"
    - "each cell is normalised in several contexts, improving illumination invariance"
    - "they remove the need for a pyramid"
    - "they make the descriptor shorter"
  answer: 1
  explain: "The redundancy captures the relative magnitudes of gradients in adjacent cells."
- q: "A very coarse image pyramid (large scaling factor) in HOG detection leads to"
  options:
    - "more false positives"
    - "missed pedestrians whose size falls between the few levels"
    - "rotation invariance"
    - "a longer descriptor"
  answer: 1
  explain: "Few levels give a poor chance of a window matching each pedestrian's size; a fine pyramid finds more but costs more."
