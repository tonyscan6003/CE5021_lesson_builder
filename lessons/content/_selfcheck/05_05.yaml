- q: "In multi-class LDA the between-class scatter S_B is defined from"
  options:
    - "the difference between two class means"
    - "the weighted deviation of each class mean from the global mean, weighted by the class size"
    - "the sum of the per-class scatter matrices"
    - "the image pixel variances"
  answer: 1
  explain: "The within-class scatter is still the sum of the per-class scatter matrices."
- q: "Why is the within-class scatter matrix usually singular for face images?"
  options:
    - "Because faces are symmetric"
    - "Because it has one row per feature (thousands) but is estimated from far fewer training images"
    - "Because the mean was not subtracted"
    - "Because the images are greyscale"
  answer: 1
  explain: "A singular S_W cannot be inverted, so S_W^-1 S_B cannot be formed."
- q: "How does the Fisherface method deal with the singularity of S_W?"
  options:
    - "It abandons LDA"
    - "It applies PCA first to reduce the dimensionality, then runs LDA in that reduced space"
    - "It adds noise to the images"
    - "It uses only two identities"
  answer: 1
  explain: "The number of PCA components is found by trial: too few loses discrimination, too many leaves S_W singular."
- q: "For a database with C identities, LDA retains at most how many directions?"
  options:
    - "C"
    - "C - 1"
    - "4096"
    - "One per training image"
  answer: 1
  explain: "Only the eigenvectors with non-zero eigenvalues are used, and there are at most C - 1 of them."
- q: "A very large condition number for S_W indicates that"
  options:
    - "the data is well conditioned"
    - "the matrix is effectively singular and its inverse cannot be computed reliably"
    - "there are too few classes"
    - "the PCA step can be skipped"
  answer: 1
  explain: "It is the practical test for whether enough dimension reduction has been applied."
- q: "Fisherfaces outperform Eigenfaces under varying illumination because"
  options:
    - "they use colour information"
    - "illumination creates large variance, which PCA preserves, whereas LDA selects directions that separate identities"
    - "they need no training data"
    - "they use larger images"
  answer: 1
  explain: "Belhumeur's paper reported this on the Harvard and Yale datasets."
- q: "To recognise a query image with a Fisherface database you must"
  options:
    - "apply the LDA transform only"
    - "apply both the stored PCA and LDA transforms, then classify, for example by nearest neighbour"
    - "recompute the eigenvectors"
    - "detect edges first"
  answer: 1
  explain: "The query must pass through exactly the same pipeline as the enrolled faces."
