# 2.3 Residual networks
# Source: reference/Grasple_image_cls_deep_cnn (exercise 107636); the last two
# are authored from lesson_2_3_script. Complete at 6 questions.
- q: What is the key problem encountered when training very deep networks?
  options:
    - The vanishing gradient problem
    - Overfitting
    - Lack of computational resources
  answer: 0
  explain: Gradients are attenuated as they propagate back through many layers, so the early layers stop learning. Very deep networks do have many parameters and can overfit, but that does not prevent training the way vanishing gradients do.
- q: How do residual networks avoid the vanishing gradient problem and allow very deep networks to be trained?
  options:
    - They use fewer layers than a plain network
    - Short paths through the identity shortcuts carry large-magnitude gradients back to the early layers
    - Batch normalisation layers rescale the gradients
  answer: 1
  explain: A ResNet behaves like an ensemble of paths of many different lengths. The short paths created by the identity shortcuts carry large gradient values straight back during backpropagation. Batch normalisation speeds training up but does not solve the vanishing gradient problem.
- q: What is the principal advantage of using batch normalisation in a neural network?
  options:
    - It reduces the number of parameters
    - It removes the need for activation functions
    - It allows a higher learning rate to be used
  answer: 2
  explain: Normalising layer outputs accelerates convergence and permits a higher learning rate. It adds a small number of parameters (γ and β) rather than reducing them, and activation functions are still needed to provide non-linearity.
- q: What is the key architectural difference between DenseNet and ResNet?
  options:
    - DenseNet uses larger convolution filters
    - DenseNet uses pooling layers and ResNet does not
    - DenseNet concatenates feature maps, ResNet adds them
  answer: 2
  explain: The residual block adds the shortcut to the block output; the dense block concatenates every earlier feature map onto the input. Both use pooling and both are built from stacks of small 3×3 and 1×1 convolutions. Because concatenation grows the channel count quickly, DenseNet concatenates only within blocks, not across them.
- q: During training, a batch norm layer normalises with the mean and variance of the current mini-batch. What does it use at inference, when a single image is classified?
  options:
    - The running mean and variance accumulated during training
    - The mean and variance of that single image
    - Nothing — batch norm layers are removed at inference
    - A mean of 0 and a variance of 1, with γ and β ignored
  answer: 0
  explain: A single image gives no batch statistics, so the running (global) mean and variance accumulated during training with μ ← dμ + (1−d)μ_B are used. γ and β are still applied, so the layer becomes a fixed scale and shift.
- q: A 56-layer plain network has a higher TRAINING error than a 20-layer one. What does this indicate?
  options:
    - The deeper network is harder to optimise, not short of capacity
    - The deeper network needs more training data
    - The learning rate is too low for the shallower network
    - The deeper network is overfitting
  answer: 0
  explain: Overfitting would show as low training error and high test error. Here the training error itself is worse, although the deeper network could in principle copy the shallow one and make its extra layers do nothing — so the problem is optimisation. This degradation is what residual connections solve.
